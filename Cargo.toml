[package]
name = "tinderboxd"
version = "0.1.0"
edition = "2024"
# egui/eframe 0.37 exigen Rust 1.95 o superior.
rust-version = "1.95"
description = "Tu Letterboxd de matches y citas"
authors = ["Daniel Esquivel"]
default-run = "tinderboxd"

# Instaladores: `cargo packager --release` (ver scripts/empaquetar-windows.ps1).
[package.metadata.packager]
product-name = "Tinderboxd"
identifier = "dev.tinderboxd.app"
publisher = "Tinderboxd"
icons = ["assets/icon.ico", "assets/icon.png"]
formats = ["nsis"]
out-dir = "dist"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"
binaries = [
    # El de la ventana es el principal (accesos directos); el otro, TUI y línea de comandos.
    { path = "tinderboxd-gui", main = true },
    { path = "tinderboxd", main = false },
]

[package.metadata.packager.nsis]
# Por usuario: no pide permisos de administrador.
installer-mode = "currentUser"
languages = ["Spanish"]
installer-icon = "assets/icon.ico"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image"] }
# Formatos de las fotos de los matches (pósters en la GUI).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Misma versión que usa eframe: sólo para forzar X11 dentro de WSL (WSLg falla con Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
